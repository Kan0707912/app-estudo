<!DOCTYPE html>
<html lang="pt-BR">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Professor</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header class="topo">
            <div class="avatar">P</div>
            <p class="nome">Professor</p>

        </footer>

    </body>

</html>
